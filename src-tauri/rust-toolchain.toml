# Windows-сборка использует GNU-цепочку, а не MSVC.
#
# Причина: на машине повреждена системная папка
# C:\ProgramData\Package Cache — VC++ Redist не может туда
# зарегистрироваться (ошибка 1392 / 0x80070570), из-за чего
# установщик Visual Studio откатывает транзакцию вместе с
# Windows SDK. Без SDK линковка через link.exe невозможна.
#
# GNU-цепочка линкуется через MinGW и ни VS, ни SDK не требует.
# Файл нужен именно здесь: Tauri CLI вызывает `cargo run`
# самостоятельно, без флага +toolchain, и иначе берёт MSVC.
[toolchain]
channel = "stable-x86_64-pc-windows-gnu"
