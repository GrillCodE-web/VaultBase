[package]
name = "vaultbase"
version = "2.12.11"
description = "VaultBase РІР‚вЂќ Desktop CRM for credit card operations"
authors = []
edition = "2021"

[lib]
name = "vaultbase_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vaultbase"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                = { version = "2", features = ["tray-icon"] }  # REDESIGN-05-6: tray-icon Р Т‘Р В»РЎРЏ РЎРѓР С‘РЎРѓРЎвЂљР ВµР СР Р…Р С•Р С–Р С• РЎвЂљРЎР‚Р ВµРЎРЏ
tauri-plugin-dialog  = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"  # UX-012: Р Р…Р В°РЎвЂљР С‘Р Р†Р Р…РЎвЂ№Р Вµ OS-РЎС“Р Р†Р ВµР Т‘Р С•Р СР В»Р ВµР Р…Р С‘РЎРЏ
tauri-plugin-global-shortcut = "2"  # REDESIGN-05-6: Р С–Р В»Р С•Р В±Р В°Р В»РЎРЉР Р…Р В°РЎРЏ panic-Р С”Р В»Р В°Р Р†Р С‘РЎв‚¬Р В°
# SEC-001: bundled-sqlcipher-vendored-openssl РЎРѓР С•Р В±Р С‘РЎР‚Р В°Р ВµРЎвЂљ SQLCipher+OpenSSL Р С‘Р В·
# Р С‘РЎРѓРЎвЂ¦Р С•Р Т‘Р Р…Р С‘Р С”Р С•Р Р† (Р Р…РЎС“Р В¶Р Р…РЎвЂ№ perl Р С‘ nasm Р Р† PATH). Р СњР В° CI-РЎР‚Р В°Р Р…Р Р…Р ВµРЎР‚Р В°РЎвЂ¦ Р С•Р Р…Р С‘ Р С—РЎР‚Р ВµР Т‘РЎС“РЎРѓРЎвЂљР В°Р Р…Р С•Р Р†Р В»Р ВµР Р…РЎвЂ№;
# Р В»Р С•Р С”Р В°Р В»РЎРЉР Р…Р С• Р Р…Р В° Windows РІР‚вЂќ C:\Program Files\Git\usr\bin (perl) + portable NASM.
rusqlite      = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
r2d2          = "0.8"
r2d2_sqlite   = "0.24"
hex           = "0.4"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
aes-gcm       = "0.10"
bcrypt        = "0.15"
sha2          = "0.10"
hkdf          = "0.13"   # MGR-004: HKDF-SHA256 Р Т‘Р В»РЎРЏ Р В·Р В°Р С—Р ВµРЎвЂЎР В°РЎвЂљР В°Р Р…Р Р…РЎвЂ№РЎвЂ¦ Р С”Р С•Р Р…Р Р†Р ВµРЎР‚РЎвЂљР С•Р Р† РЎвЂљР ВµР В»Р ВµР СР ВµРЎвЂљРЎР‚Р С‘Р С‘
x25519-dalek  = { version = "2", features = ["static_secrets"] }  # MGR-004: РЎРЊРЎвЂћР ВµР СР ВµРЎР‚Р Р…РЎвЂ№Р в„– X25519 (sealed box РІвЂ вЂ™ Р СР ВµР Р…Р ВµР Т‘Р В¶Р ВµРЎР‚)
ed25519-dalek = { version = "2", features = ["rand_core"] }  # SEC ETAP-A P.10: sync payload signing (anti-tamper)
pbkdf2        = { version = "0.12", features = ["simple"] }
argon2        = "0.5"  # SEC ETAP-A P.1: Argon2id memory-hard KDF (Р·Р°РјРµРЅР° PBKDF2)
hmac          = "0.12"
base64        = "0.22"
uuid          = { version = "1", features = ["v4"] }
chrono        = { version = "0.4", features = ["serde"] }
ureq          = { version = "2", features = ["json"] }
# 7rn: cert pinning вЂ” rustls/webpki-roots СѓР¶Рµ РІ РґРµСЂРµРІРµ С‡РµСЂРµР· ureq (С‚РѕС‚ Р¶Рµ
# feature-СЃРµС‚, aws-lc-rs РЅРµ С‚СЏРЅРµРј); РІРµСЂСЃРёРё СЃРѕРІРїР°РґР°СЋС‚ СЃ Cargo.lock.
rustls        = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots  = "0.26"
regex         = "1"
rand          = "0.8"
once_cell     = "1"
dirs          = "5"
imap          = "2.4"
native-tls    = "0.2"
mailparse     = "0.14"
tungstenite   = { version = "0.23", features = ["native-tls", "rustls-tls-webpki-roots"] }  # 7rn: rustls-РєРѕРЅРЅРµРєС‚РѕСЂ вЂ” РґР»СЏ SPKI-РїРёРЅРЅРёРЅРіР° WS
lettre        = { version = "0.11", features = ["native-tls", "smtp-transport", "builder"] }
zeroize       = { version = "1.7", features = ["derive"] }  # FIX ZEROIZE-01: Secure memory zeroing for passwords
urlencoding   = "2.1"  # For USPS API URL encoding
tracing            = "0.1"  # SPRINT3-DAY2: Structured logging framework
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }  # SPRINT3-DAY2: Log subscriber with JSON support
tracing-appender   = "0.2"  # SPRINT3-DAY2: File appender for logs
toml               = "0.8"  # SPRINT3-DAY3: TOML configuration parser
# DEVOPS-003: crash-reporting. Р СџР В»Р В°Р С–Р С‘Р Р… Р С‘Р Р…Р В¶Р ВµР С”РЎвЂљР С‘РЎвЂљ @sentry/browser Р Р†Р С• Р Р†РЎРѓР Вµ webview Р С‘
# Р С–Р С•Р Р…Р С‘РЎвЂљ JS-Р С‘Р Р†Р ВµР Р…РЎвЂљРЎвЂ№ РЎвЂЎР ВµРЎР‚Р ВµР В· Rust-Р В±РЎРЊР С”Р ВµР Р…Р Т‘; minidump Р В»Р С•Р Р†Р С‘РЎвЂљ Р Р…Р В°РЎвЂљР С‘Р Р†Р Р…РЎвЂ№Р Вµ Р С”РЎР‚Р В°РЎв‚¬Р С‘.
# Р С’Р С”РЎвЂљР С‘Р Р†Р ВµР Р… РЎвЂљР С•Р В»РЎРЉР С”Р С• Р С”Р С•Р С–Р Т‘Р В° Р В·Р В°Р Т‘Р В°Р Р… DSN (env SENTRY_DSN Р С‘Р В»Р С‘ [sentry] dsn Р Р† TOML).
sentry               = { version = "0.49", features = ["release-health"] }
tauri-plugin-sentry  = "0.6"

[dev-dependencies]
tempfile = "3"  # SPRINT3-DAY1: Temp directories for testing

[features]
custom-protocol = ["tauri/custom-protocol"]
