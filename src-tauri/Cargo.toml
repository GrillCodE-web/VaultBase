[package]
name = "vaultbase"
version = "2.5.3"
description = "VaultBase — Desktop CRM for credit card operations"
authors = []
edition = "2021"

[lib]
name = "vaultbase_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vaultbase"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                = { version = "2", features = [] }
tauri-plugin-dialog  = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rusqlite      = { version = "0.31", features = ["bundled"] }
r2d2          = "0.8"
r2d2_sqlite   = "0.24"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
aes-gcm       = "0.10"
bcrypt        = "0.15"
sha2          = "0.10"
pbkdf2        = { version = "0.12", features = ["simple"] }
hmac          = "0.12"
base64        = "0.22"
uuid          = { version = "1", features = ["v4"] }
chrono        = { version = "0.4", features = ["serde"] }
ureq          = { version = "2", features = ["json"] }
regex         = "1"
rand          = "0.8"
once_cell     = "1"
dirs          = "5"
imap          = "2.4"
native-tls    = "0.2"
mailparse     = "0.14"
tungstenite   = { version = "0.23", features = ["native-tls"] }
lettre        = { version = "0.11", features = ["native-tls", "smtp-transport", "builder"] }
zeroize       = { version = "1.7", features = ["derive"] }  # FIX ZEROIZE-01: Secure memory zeroing for passwords
urlencoding   = "2.1"  # For USPS API URL encoding

[features]
custom-protocol = ["tauri/custom-protocol"]
