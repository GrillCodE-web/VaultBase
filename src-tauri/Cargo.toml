[package]
name = "vaultbase"
version = "2.12.10"
description = "VaultBase вЂ” Desktop CRM for credit card operations"
authors = []
edition = "2021"

[lib]
name = "vaultbase_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vaultbase"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                = { version = "2", features = ["tray-icon"] }  # REDESIGN-05-6: tray-icon РґР»СЏ СЃРёСЃС‚РµРјРЅРѕРіРѕ С‚СЂРµСЏ
tauri-plugin-dialog  = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"  # UX-012: РЅР°С‚РёРІРЅС‹Рµ OS-СѓРІРµРґРѕРјР»РµРЅРёСЏ
tauri-plugin-global-shortcut = "2"  # REDESIGN-05-6: РіР»РѕР±Р°Р»СЊРЅР°СЏ panic-РєР»Р°РІРёС€Р°
# SEC-001: bundled-sqlcipher-vendored-openssl СЃРѕР±РёСЂР°РµС‚ SQLCipher+OpenSSL РёР·
# РёСЃС…РѕРґРЅРёРєРѕРІ (РЅСѓР¶РЅС‹ perl Рё nasm РІ PATH). РќР° CI-СЂР°РЅРЅРµСЂР°С… РѕРЅРё РїСЂРµРґСѓСЃС‚Р°РЅРѕРІР»РµРЅС‹;
# Р»РѕРєР°Р»СЊРЅРѕ РЅР° Windows вЂ” C:\Program Files\Git\usr\bin (perl) + portable NASM.
rusqlite      = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
r2d2          = "0.8"
r2d2_sqlite   = "0.24"
hex           = "0.4"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
aes-gcm       = "0.10"
bcrypt        = "0.15"
sha2          = "0.10"
hkdf          = "0.12"   # MGR-004: HKDF-SHA256 РґР»СЏ Р·Р°РїРµС‡Р°С‚Р°РЅРЅС‹С… РєРѕРЅРІРµСЂС‚РѕРІ С‚РµР»РµРјРµС‚СЂРёРё
x25519-dalek  = { version = "2", features = ["static_secrets"] }  # MGR-004: СЌС„РµРјРµСЂРЅС‹Р№ X25519 (sealed box в†’ РјРµРЅРµРґР¶РµСЂ)
ed25519-dalek = { version = "2", features = ["rand_core"] }  # SEC ETAP-A P.10: sync payload signing (anti-tamper)
pbkdf2        = { version = "0.12", features = ["simple"] }
argon2        = "0.5"  # SEC ETAP-A P.1: Argon2id memory-hard KDF (замена PBKDF2)
hmac          = "0.12"
base64        = "0.22"
uuid          = { version = "1", features = ["v4"] }
chrono        = { version = "0.4", features = ["serde"] }
ureq          = { version = "2", features = ["json"] }
# 7rn: cert pinning — rustls/webpki-roots уже в дереве через ureq (тот же
# feature-сет, aws-lc-rs не тянем); версии совпадают с Cargo.lock.
rustls        = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots  = "0.26"
regex         = "1"
rand          = "0.8"
once_cell     = "1"
dirs          = "5"
imap          = "2.4"
native-tls    = "0.2"
mailparse     = "0.14"
tungstenite   = { version = "0.23", features = ["native-tls", "rustls-tls-webpki-roots"] }  # 7rn: rustls-коннектор — для SPKI-пиннинга WS
lettre        = { version = "0.11", features = ["native-tls", "smtp-transport", "builder"] }
zeroize       = { version = "1.7", features = ["derive"] }  # FIX ZEROIZE-01: Secure memory zeroing for passwords
urlencoding   = "2.1"  # For USPS API URL encoding
tracing            = "0.1"  # SPRINT3-DAY2: Structured logging framework
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }  # SPRINT3-DAY2: Log subscriber with JSON support
tracing-appender   = "0.2"  # SPRINT3-DAY2: File appender for logs
toml               = "0.8"  # SPRINT3-DAY3: TOML configuration parser
# DEVOPS-003: crash-reporting. РџР»Р°РіРёРЅ РёРЅР¶РµРєС‚РёС‚ @sentry/browser РІРѕ РІСЃРµ webview Рё
# РіРѕРЅРёС‚ JS-РёРІРµРЅС‚С‹ С‡РµСЂРµР· Rust-Р±СЌРєРµРЅРґ; minidump Р»РѕРІРёС‚ РЅР°С‚РёРІРЅС‹Рµ РєСЂР°С€Рё.
# РђРєС‚РёРІРµРЅ С‚РѕР»СЊРєРѕ РєРѕРіРґР° Р·Р°РґР°РЅ DSN (env SENTRY_DSN РёР»Рё [sentry] dsn РІ TOML).
sentry               = { version = "0.49", features = ["release-health"] }
tauri-plugin-sentry  = "0.6"

[dev-dependencies]
tempfile = "3"  # SPRINT3-DAY1: Temp directories for testing

[features]
custom-protocol = ["tauri/custom-protocol"]
