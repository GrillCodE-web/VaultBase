[package]
name = "vaultbase"
version = "2.12.5"
description = "VaultBase — Desktop CRM for credit card operations"
authors = []
edition = "2021"

[lib]
name = "vaultbase_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vaultbase"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                = { version = "2", features = ["tray-icon"] }  # REDESIGN-05-6: tray-icon для системного трея
tauri-plugin-dialog  = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"  # UX-012: нативные OS-уведомления
tauri-plugin-global-shortcut = "2"  # REDESIGN-05-6: глобальная panic-клавиша
# SEC-001: bundled-sqlcipher-vendored-openssl собирает SQLCipher+OpenSSL из
# исходников (нужны perl и nasm в PATH). На CI-раннерах они предустановлены;
# локально на Windows — C:\Program Files\Git\usr\bin (perl) + portable NASM.
rusqlite      = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
r2d2          = "0.8"
r2d2_sqlite   = "0.24"
hex           = "0.4"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
aes-gcm       = "0.10"
bcrypt        = "0.15"
sha2          = "0.10"
hkdf          = "0.12"   # MGR-004: HKDF-SHA256 для запечатанных конвертов телеметрии
x25519-dalek  = { version = "2", features = ["static_secrets"] }  # MGR-004: эфемерный X25519 (sealed box → менеджер)
pbkdf2        = { version = "0.12", features = ["simple"] }
hmac          = "0.12"
base64        = "0.22"
uuid          = { version = "1", features = ["v4"] }
chrono        = { version = "0.4", features = ["serde"] }
ureq          = { version = "2", features = ["json"] }
regex         = "1"
rand          = "0.10"
once_cell     = "1"
dirs          = "5"
imap          = "2.4"
native-tls    = "0.2"
mailparse     = "0.14"
tungstenite   = { version = "0.23", features = ["native-tls"] }
lettre        = { version = "0.11", features = ["native-tls", "smtp-transport", "builder"] }
zeroize       = { version = "1.7", features = ["derive"] }  # FIX ZEROIZE-01: Secure memory zeroing for passwords
urlencoding   = "2.1"  # For USPS API URL encoding
tracing            = "0.1"  # SPRINT3-DAY2: Structured logging framework
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }  # SPRINT3-DAY2: Log subscriber with JSON support
tracing-appender   = "0.2"  # SPRINT3-DAY2: File appender for logs
toml               = "0.8"  # SPRINT3-DAY3: TOML configuration parser
# DEVOPS-003: crash-reporting. Плагин инжектит @sentry/browser во все webview и
# гонит JS-ивенты через Rust-бэкенд; minidump ловит нативные краши.
# Активен только когда задан DSN (env SENTRY_DSN или [sentry] dsn в TOML).
sentry               = { version = "0.49", features = ["release-health"] }
tauri-plugin-sentry  = "0.6"

[dev-dependencies]
tempfile = "3"  # SPRINT3-DAY1: Temp directories for testing

[features]
custom-protocol = ["tauri/custom-protocol"]
