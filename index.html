<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vaultbase-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VaultBase</title>
    <!-- Фон первого кадра до монтирования React: окно показывается сразу
         (visible:true), а перед mount идёт async-проверка кеша — без этого
         WebView2 заливает окно белым и на открытии видна вспышка. Тёмная
         тема — дефолт приложения (useTheme → 'dark'). -->
    <style>
      html,
      body {
        margin: 0;
        /* var(--bg) с fallback: до загрузки tokens.css — тёмный anti-flash,
           после — фон следует активной теме (вне слоёв, перебивает @layer app). */
        background: var(--bg, #0c0d10);
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
