<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>VaultBase Admin — Вход</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="vendor/fonts.css" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d12; --surface:#12151d; --surface2:#181c26; --surface3:#1f2431;
    --border:#222838; --border-strong:#2e3548;
    --text:#e8ecf4; --text-2:#9aa3b2; --muted:#667084;
    --accent:#6c63ff; --accent-2:#8b7dff; --green:#00d4aa; --red:#ff5470;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',-apple-system,'Segoe UI',sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(700px 380px at 50% -10%, rgba(108,99,255,.10), transparent 60%),
      radial-gradient(500px 300px at 85% 100%, rgba(0,212,170,.05), transparent 60%);
  }
  .card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:18px; padding:36px 34px; width:380px; position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
    animation:in .25s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .logo{
    width:46px;height:46px;border-radius:12px;margin-bottom:18px;
    background:linear-gradient(135deg,var(--accent),var(--green));
    display:grid;place-items:center;font-weight:800;font-size:17px;color:#0b0d12;
  }
  h1{font-size:19px;font-weight:800;letter-spacing:-.3px}
  .sub{font-size:13px;color:var(--muted);margin:5px 0 24px}
  .field{margin-bottom:14px}
  label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px}
  input{
    width:100%;background:var(--surface2);border:1px solid var(--border);
    border-radius:9px;padding:10px 13px;color:var(--text);font-size:14px;
    font-family:inherit;outline:none;transition:.15s;
  }
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,.15)}
  .btn{
    width:100%;padding:11px;border:none;border-radius:9px;margin-top:6px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#fff;font-size:14px;font-weight:700;font-family:inherit;
    cursor:pointer;transition:.15s;
  }
  .btn:hover:not(:disabled){filter:brightness(1.12)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .error{
    display:none;background:rgba(255,84,112,.1);border:1px solid rgba(255,84,112,.35);
    color:var(--red);font-size:13px;font-weight:500;border-radius:9px;
    padding:9px 13px;margin-bottom:14px;
  }
  .foot{margin-top:20px;font-size:11px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="logo">VB</div>
  <h1>Панель управления</h1>
  <p class="sub">VaultBase Sync Server — авторизация</p>
  <div class="error" id="err"></div>
  <form id="loginForm">
    <div class="field">
      <label>Логин</label>
      <input id="user" type="text" autocomplete="username" required>
    </div>
    <div class="field">
      <label>Пароль</label>
      <input id="pass" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn" id="btn" type="submit">Войти</button>
  </form>
  <div class="foot">Доступ только для администраторов</div>
</div>
<script>
const BASE = window.location.pathname.replace(/\/login\/?$/, '');
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  err.style.display = 'none';
  btn.disabled = true;
  try {
    const res = await fetch(BASE + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('user').value,
        password: document.getElementById('pass').value,
      }),
    });
    if (res.ok) {
      const next = new URLSearchParams(location.search).get('next');
      location.href = next && next.startsWith('/') ? next : BASE + '/';
    } else {
      const d = await res.json().catch(() => ({}));
      err.textContent = d.error || 'Неверный логин или пароль';
      err.style.display = 'block';
    }
  } catch {
    err.textContent = 'Сервер недоступен';
    err.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
