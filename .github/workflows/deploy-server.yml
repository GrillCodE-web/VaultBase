# Deploy cc-sync-server РЅР° VPS (MASTER-5). РўРѕР»СЊРєРѕ РІСЂСѓС‡РЅСѓСЋ вЂ” С‡С‚РѕР±С‹ РЅРµ Р±С‹Р»Рѕ
# СЃСЋСЂРїСЂРёР·РѕРІ РѕС‚ Р°РІС‚РѕРґРµРїР»РѕСЏ: Actions в†’ Deploy Server в†’ Run workflow.
#
# РўСЂРµР±СѓСЋС‚СЃСЏ GitHub Secrets (Settings в†’ Secrets в†’ Actions):
#   VPS_HOST        вЂ” 209.74.89.158 (С‡РёСЃС‚С‹Р№ С…РѕСЃС‚, Р±РµР· user@)
#   VPS_USER        вЂ” root
#   VPS_SSH_KEY     вЂ” РїСЂРёРІР°С‚РЅС‹Р№ РєР»СЋС‡ .secrets/vaultbase-deploy.key (Р»РѕРєР°Р»СЊРЅРѕ, РЅРµ РІ git)

name: Deploy Server

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy cc-sync-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Backup remote database
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'cp /opt/cc-sync-server/data.db /opt/cc-sync-server/data.db.bak-deploy-$(date +%Y%m%d-%H%M%S)'

      - name: Sync server files
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            cc-sync-server/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/cc-sync-server/ \
            --exclude='node_modules' \
            --exclude='data.db*' \
            --exclude='.env' \
            --exclude='bin_cache.db' \
            --exclude='test' \
            --exclude='docs'

      - name: Install deps and restart
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            cd /opt/cc-sync-server
            npm install --production --silent
            pm2 restart cc-sync-server
            sleep 3
            curl -sf http://127.0.0.1:3000/health > /dev/null
            echo "deploy OK, health 200"
          EOF
