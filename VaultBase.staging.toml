# VaultBase Staging Configuration
# Only sections that are actually read by the application at runtime.

[app]
profile = "staging"
name = "VaultBase"
version = "2.11.3"
debug = false

[security]
rate_limit_strict = 5        # Auth attempts per minute
rate_limit_moderate = 30     # API calls per minute
rate_limit_lenient = 100     # General calls per minute
pbkdf2_iterations = 600000   # Password hashing iterations
session_timeout = 3600       # Session timeout in seconds
autolock_timeout = 30        # Auto-lock timeout in seconds

[background]
license_check_interval = 60
sync_interval = 60
stuffer_poll_interval = 300
fulfillment_check_interval = 1800
risk_check_interval = 300
quarantine_cleanup_interval = 1800
catalog_update_interval = 3600

# ─────────────────────────────────────────────────────
# Staging Notes:
# - Debug mode disabled for production-like behavior
# - Real server URLs from constants.rs
# - Same background intervals as production

# ─────────────────────────────────────────────────────
# DEVOPS-002: как запустить клиент против staging-сервера.
# Профиль берётся ТОЛЬКО debug-сборкой (release всегда production — DEVOPS-005).
# PowerShell перед `npx tauri dev` (или `npm run tauri build -- --debug`):
#   $env:VAULTBASE_PROFILE='staging'
#   $env:VAULTBASE_CONFIG_DIR='<папка с этим TOML>'
#   $env:VAULTBASE_SERVER_URL='https://<staging-host>'
#   $env:VAULTBASE_SYNC_WS_URL='wss://<staging-host>/ws'   # если WS не выводится из базы
# Подробности и серверная часть — docs/STAGING.md.

[sentry]
# DEVOPS-003: crash-reporting. Публичный DSN проекта Sentry (не секрет).
# Пусто = выключено, приложение ничего не отправляет. Переопределяется env SENTRY_DSN.
dsn = ""
